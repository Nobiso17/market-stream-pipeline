# Copy to ~/.dbt/profiles.yml (or set DBT_PROFILES_DIR to this folder)
market_stream:
  target: dev
  outputs:
    dev:
      type: postgres
      host: localhost
      port: 5432
      user: market
      password: market
      dbname: market_data
      schema: public
      threads: 4

    # Example Snowflake target for when you migrate off local Postgres
